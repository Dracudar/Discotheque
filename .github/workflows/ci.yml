name: CI

on:
  push:
    branches: [main, develop]
  # Toutes les PR, y compris celles empilées sur une autre branche de livrable
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # La machine cible : Windows, Python 3.14
          - os: windows-latest
            python: "3.14"
          # Repli prévu dans le plan (et environnement des sessions cloud)
          - os: ubuntu-latest
            python: "3.13"
    env:
      FPCALC_VERSION: "1.6.1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip

      - name: Outils audio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # En pwsh, l'échec d'un programme externe n'arrête pas le script : on vérifie
        # nous-mêmes que chaque outil est bien là, sinon l'étape échoue ici, pas dans pytest.
        run: |
          # Le serveur Chocolatey est parfois indisponible (504) : jusqu'à 3 essais.
          # choco peut aussi finir sans erreur sans rien installer, d'où le Get-Command.
          for ($essai = 1; $essai -le 3; $essai++) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -eq 0 -and (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { break }
            if ($essai -eq 3) { throw "ffmpeg n'a pas pu être installé (Chocolatey), après 3 essais" }
            Write-Host "ffmpeg absent après l'essai $essai, nouvel essai dans 30 s"
            Start-Sleep -Seconds 30
          }
          $zip = "chromaprint-fpcalc-$env:FPCALC_VERSION-windows-x86_64"
          Invoke-WebRequest "https://github.com/acoustid/chromaprint/releases/download/v$env:FPCALC_VERSION/$zip.zip" -OutFile fpcalc.zip
          Expand-Archive fpcalc.zip -DestinationPath "$env:RUNNER_TEMP\fpcalc"
          $dossier = Get-ChildItem -Recurse "$env:RUNNER_TEMP\fpcalc" -Filter fpcalc.exe |
            ForEach-Object { $_.DirectoryName } | Select-Object -First 1
          if (-not $dossier) { throw "fpcalc.exe introuvable dans l'archive $zip.zip" }
          $dossier | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Outils audio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          tgz="chromaprint-fpcalc-${FPCALC_VERSION}-linux-x86_64"
          curl -sSL "https://github.com/acoustid/chromaprint/releases/download/v${FPCALC_VERSION}/${tgz}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$tgz" >> "$GITHUB_PATH"

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check src tests

      - name: Tests
        run: pytest

      - name: Diagnostic de l'environnement
        # Sans config.toml, la configuration n'est qu'un point d'attention :
        # le diagnostic échoue seulement si Python, SQLite ou un outil pose problème.
        run: python -m src doctor
