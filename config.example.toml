# Configuration locale de la discothèque.
# Copier ce fichier en « config.toml » (non versionné) et adapter les chemins à la machine.
# Les chaînes entre apostrophes sont littérales : les « \ » de Windows n'ont pas à être doublés.
# Aucun chemin réel ne doit figurer dans le dépôt : les exemples utilisent le lecteur X:.

[chemins]
# Racine de la discothèque. Pendant le développement : une copie de travail (sandbox) ;
# en production : la discothèque elle-même. Seule clé obligatoire de cette section.
musique = 'X:\Musique'
# Dossiers système, à la racine par défaut (décommenter pour les déplacer) :
# sortie = 'X:\Musique\_discotheque'        # pages, index et caches
# donnees = 'X:\Musique\_discotheque\_data' # index SQLite et caches
# journaux = 'X:\Musique\_log'              # journaux détaillés
# rapports = 'X:\Musique\_reports'          # rapports lisibles des résultats
# corbeille = 'X:\Musique\_to_delete'       # ce que les opérations retirent (jamais supprimé)
# bot = 'X:\Musique\_bot'                   # installation de production
# arrivees = 'X:\Musique\_sort'             # arrivées depuis le baladeur

[references]
# Données de référence hors dépôt, lues par les tests locaux et les comparaisons.
# Résultats et scripts de l'audit de septembre 2026.
audit = 'X:\Travail\_audit'
# Fiches d'achat réalisées à la main (recap.json), référence du jalon 4.1.
fiches_achat = 'X:\Travail\Fiches artistes'

[dap]
# Dossier de musique du baladeur, pour les commandes lancées depuis le PC.
# Le lanceur posé sur le baladeur (« disco dap lanceur ») donne ce chemin lui-même.
destination = 'X:\Baladeur\Music'

[sauvegarde]
# Copie froide sur un autre disque (« disco sauvegarde envoyer »).
destination = 'X:\Sauvegarde\Musique'

[outils]
# Nom de la commande si elle est dans le PATH, sinon chemin complet de l'exécutable.
ffmpeg = 'ffmpeg'
ffprobe = 'ffprobe'
fpcalc = 'fpcalc'

[analyse]
# ReplayGain 2 : référence -18 LUFS (BS.1770). Crête vraie par suréchantillonnage x8.
reference_lufs = -18.0
surechantillonnage_crete = 8
# Nombre de pistes analysées en parallèle (0 = nombre de cœurs - 2)
processus = 0

# Dossiers de premier niveau de la discothèque.
# type : artistes, classique, compilations, projets, vrac, arrivees, ignore
# pages : génère des pages (album, artiste, projet, compositeur)
# rg_album : calcule et écrit le ReplayGain album (sinon piste seulement)
[categories."Artists"]
type = "artistes"
pages = true
rg_album = true

[categories."Classical music"]
type = "classique"
pages = true
rg_album = true

[categories."Compilations"]
type = "compilations"
pages = true
rg_album = true

[categories."Musicals"]
type = "projets"
pages = true
rg_album = true

[categories."Original Game Soundtrack"]
type = "projets"
pages = true
rg_album = true

[categories."Soundtrack"]
type = "projets"
pages = true
rg_album = true

[categories."Night"]
type = "vrac"
pages = false
rg_album = false

[categories."Bulk"]
type = "vrac"
pages = false
rg_album = false

[categories."_sort"]
type = "arrivees"
pages = false
rg_album = false

# Les autres dossiers système de la racine (_discotheque, _bot, _log, _reports,
# _to_delete…) sont ignorés automatiquement : tout dossier qui commence par « _ ».
