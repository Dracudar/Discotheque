[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "discotheque"
version = "0.1.0.dev0"
description = "Indexation, analyses qualité et pages de la discothèque"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Dracudar" }]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
disco = "disco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disco = ["modeles/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
# Les scripts de l'audit sont conservés tels quels, ils ne sont pas vérifiés
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
