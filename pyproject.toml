[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "discotheque"
dynamic = ["version"]
description = "Indexation, analyses qualité et pages de la discothèque"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Dracudar" }]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
disco = "src.core.cli:main"

# src/ est lui-même le paquet (voir docs/ARCHITECTURE.md)
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.dynamic]
# Seule source de la version du programme : src/assets/versions.toml, lu par src/__versions__.py
version = { attr = "src.__versions__.__version__" }

[tool.setuptools.package-data]
src = ["assets/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
# Les scripts de l'audit sont conservés tels quels, ils ne sont pas vérifiés
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
