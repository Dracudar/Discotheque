# Réglages personnels de la discothèque : modèle de <racine>\_bot\config.toml.
#
# Ce fichier est entièrement commenté : tel quel, il ne change rien. Le programme
# embarque une configuration par défaut complète (structure de la racine, catégories
# standard, réglages d'analyse : config_default.toml, à côté de ce fichier).
# Décommenter seulement ce qui doit différer : chaque clé écrite l'emporte sur le défaut.
# « disco config » affiche l'origine de chaque valeur (défaut, _bot, clone, déduit).
#
# Les chaînes entre apostrophes sont littérales : les « \ » de Windows n'ont pas à être doublés.
# Les exemples utilisent le lecteur fictif X:.

# [paths]
# Racine de la discothèque : inutile ici, elle se déduit de l'emplacement de ce fichier
# (le dossier parent de _bot).
# root = 'X:\Musique'
#
# Dossiers système, à la racine par défaut (décommenter pour les déplacer) :
# incoming = 'X:\Musique\_sort'                      # arrivées (boîte de dépôt)
# playlists = 'X:\Musique\_playlists'                # playlists du baladeur
# bot = 'X:\Musique\_bot'                            # installation de production
# logs = 'X:\Musique\_bot\_log'                      # journal de toutes les actions du bot
# output = 'X:\Musique\_data'                        # données générées (spectrogrammes…)
# db = 'X:\Musique\_data\_base'                      # index SQLite : jamais effacé
# cache = 'X:\Musique\_data\_cache'                  # réponses des services en ligne
# workspace = 'X:\Musique\_workspace'                # travail du bot, sur des copies
# Sous-dossiers de workspace (déduits de workspace s'ils ne sont pas écrits) :
# process = 'X:\Musique\_workspace\_process'         # copies en cours de traitement, jetables
# in_review = 'X:\Musique\_workspace\_in_review'     # résultats en attente de validation
# pending = 'X:\Musique\_workspace\_pending'         # cas que le bot ne sait pas trancher
# reports = 'X:\Musique\_workspace\_reports'         # rapports lisibles des résultats
# trash = 'X:\Musique\_workspace\_bin'               # corbeille (voir [trash])

# [trash]
# Jours avant la suppression définitive d'un lot de la corbeille (0 = jamais)
# retention_days = 30

# [tools]
# Par défaut, les outils sont cherchés dans <racine>\_bot\tools, puis dans le PATH.
# Indiquer un chemin complet seulement pour en utiliser un autre.
# ffmpeg = 'X:\Outils\ffmpeg.exe'
# ffprobe = 'X:\Outils\ffprobe.exe'
# fpcalc = 'X:\Outils\fpcalc.exe'

# [analysis]
# Sonie de référence du ReplayGain 2, en LUFS
# reference_lufs = -18.0
# Suréchantillonnage pour la crête vraie
# true_peak_oversampling = 8
# Nombre de pistes analysées en parallèle (0 = nombre de cœurs - 2)
# workers = 4

# Catégories : celles par défaut (Artists, Classical music, Compilations, Musicals,
# Soundtrack, Bulk, _sort) s'appliquent toujours. Ici, seulement les ajouts et les
# changements, clé par clé.
# type : artists, classical, compilations, projects, bulk, incoming, ignore
# pages : a des pages dans l'interface (album, artiste, projet, compositeur)
# rg_album : calcule et écrit le ReplayGain album (sinon piste seulement)

# Ajout : une copie de Soundtrack pour un genre précis.
# [categories."Soundtrack Exemple"]
# type = "projects"
# pages = true
# rg_album = true

# Ajout : une archive séparée, traitée comme Bulk.
# [categories."Archive Exemple"]
# type = "bulk"
# pages = false
# rg_album = false

# Changement d'une seule clé d'une catégorie par défaut (le reste est conservé).
# [categories."Compilations"]
# rg_album = false

# Retrait d'une catégorie par défaut : la déclarer ignorée.
# [categories."Musicals"]
# type = "ignore"
