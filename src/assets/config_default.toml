# Configuration par défaut, intégrée au programme.
# Elle s'applique toujours, sous <racine>\_bot\config.toml puis le config.toml du clone :
# ces fichiers ne contiennent que ce qui diffère (voir config.example.toml, à côté).
# Les chemins des dossiers système se déduisent de la racine (voir src.backend.config).

[analysis]
# ReplayGain 2 : référence -18 LUFS (BS.1770). Crête vraie par suréchantillonnage x8.
reference_lufs = -18.0
true_peak_oversampling = 8
# Nombre de pistes analysées en parallèle (0 = nombre de cœurs - 2)
workers = 0

# Dossiers de premier niveau de la discothèque.
# type : artists, classical, compilations, projects, bulk, incoming, ignore
# pages : génère des pages (album, artiste, projet, compositeur)
# rg_album : calcule et écrit le ReplayGain album (sinon piste seulement)
[categories."Artists"]
type = "artists"
pages = true
rg_album = true

[categories."Classical music"]
type = "classical"
pages = true
rg_album = true

[categories."Compilations"]
type = "compilations"
pages = true
rg_album = true

[categories."Musicals"]
type = "projects"
pages = true
rg_album = true

[categories."Soundtrack"]
type = "projects"
pages = true
rg_album = true

[categories."Bulk"]
type = "bulk"
pages = false
rg_album = false

[categories."_sort"]
type = "incoming"
pages = false
rg_album = false

# Les autres dossiers système de la racine (_data, _bot, _log, _reports,
# _to_delete…) sont ignorés automatiquement : tout dossier qui commence par « _ ».
